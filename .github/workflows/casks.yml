name: Cask checks
on:
  push:
    branches: [master]
    paths: &Paths [
      Casks/**,
      completions/shellcheck/**,
      manpages/envctl/**,
      renovate.json,
      .github/scripts/check-shellcheck.ts,
      .github/scripts/check-release-casks.ts,
      .github/scripts/check-cask-install.sh,
      .github/workflows/casks.yml,
    ]
  pull_request:
    paths: *Paths
  workflow_dispatch:
permissions: { contents: read }
jobs:
  shellcheck:
    name: ShellCheck release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - run: ruby -c Casks/shellcheck.rb
      - name: Verify all release checksums and completion versions
        run: deno run --allow-read=Casks,completions --allow-net .github/scripts/check-shellcheck.ts
      - name: Check Bash completion behavior
        run: python3 completions/shellcheck/tests/test_bash.py
      - name: Verify runner, SVG, rshellcheck, and envctl releases
        run: deno run --allow-read=Casks,manpages --allow-net .github/scripts/check-release-casks.ts
  macos:
    name: Cask installs (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Update Homebrew and register the checked-out tap
        run: |
          HOMEBREW_DISABLE_LOAD_FORMULA=1 brew update
          brew --version
          sw_vers
          uname -m
          brew tap --custom-remote kjanat/tap "$GITHUB_WORKSPACE"
          test "$(git -C "$(brew --repository kjanat/tap)" rev-parse HEAD)" = "$(git rev-parse HEAD)"
      - name: Install Bash for envctl completion checks
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install bash
      - name: Install, reinstall, and uninstall all casks
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: bash .github/scripts/check-cask-install.sh
