name: Workflow checks
on:
  push:
    branches: [master]
    paths: &actionlint [".github/workflows/**", "**/action.y*ml", ".github/actionlint.*", "bin/actionlint"]
  pull_request:
    paths: *actionlint
  workflow_dispatch:
permissions: { contents: read }
jobs:
  workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - parallel:
          - uses: actions/checkout@v7
            with: { persist-credentials: false }
          - run: echo "${PWD}/bin" >> "${GITHUB_PATH}"
          - uses: kjanat/shellcheck-rs@master
      - name: Run actionlint
        run: actionlint
        continue-on-error: true
