name: Update cask
description: Rewrites the version stanza and every sha256 stanza of a cask from release asset digests.

inputs:
  cask: { description: Path to the cask file., required: true }
  version: { description: New version., required: true }
  assets: { description: "JSON array of { name, digest } from the release-assets action.", required: true }

outputs:
  changed: { description: true when the file was rewritten., value: "${{ steps.run.outputs.changed }}" }
  previous-version: { description: Version the cask had before., value: "${{ steps.run.outputs.previous-version }}" }

runs:
  using: composite
  steps:
    - { uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed, with: { deno-version: v2.x } } # v2
    - uses: kjanat/actions-shells@697bb547ef1ce427e202b4cbcdb19886aa587da7 # v0
    - id: run
      name: Update cask version and hashes
      shell: actions-shell deno {0}
      env:
        INPUT_CASK: ${{ inputs.cask }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ASSETS: ${{ inputs.assets }}
      run: |
        import { input, parseDigests, setOutput, updateCask } from 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/actions/lib.ts';

        const path = input('cask', { required: true });
        const version = input('version', { required: true });
        const assets = parseDigests(JSON.parse(input('assets', { required: true })));

        const result = updateCask(await Deno.readTextFile(path), version, assets);
        if (result.changed) await Deno.writeTextFile(path, result.text);
        await setOutput('changed', String(result.changed));
        await setOutput('previous-version', result.previous);
