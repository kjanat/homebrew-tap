name: Commit and open a pull request
description: Commits tracked changes to a branch and opens a pull request. Reuses existing branches and pull requests, and retries missing pull requests.

inputs:
  branch: { description: Branch to create., required: true }
  title: { description: Pull request title., required: true }
  message: { description: Commit message. Defaults to the title., required: false, default: "" }
  body: { description: Pull request body., required: false, default: "" }
  base: { description: Base branch., required: false, default: "${{ github.event.repository.default_branch }}" }
  author-name: { description: Commit author name., required: false, default: "github-actions[bot]" }
  author-email: { description: Commit author email., required: false, default: "41898282+github-actions[bot]@users.noreply.github.com" }
  token: { description: Token for pushing and for gh., required: false, default: "${{ github.token }}" }

outputs:
  result: { description: "created, exists, or unchanged when there are no tracked changes.", value: "${{ steps.run.outputs.result }}" }
  url: { description: Created or existing pull request URL., value: "${{ steps.run.outputs.url }}" }

runs:
  using: composite
  steps:
    - { uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed, with: { deno-version: v2.x } } # v2
    - uses: kjanat/actions-shells@697bb547ef1ce427e202b4cbcdb19886aa587da7 # v0
    - id: run
      name: Commit changes and open pull request
      shell: actions-shell deno {0}
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_BODY: ${{ inputs.body }}
        INPUT_BASE: ${{ inputs.base }}
        GIT_AUTHOR_NAME: ${{ inputs.author-name }}
        GIT_AUTHOR_EMAIL: ${{ inputs.author-email }}
        GIT_COMMITTER_NAME: ${{ inputs.author-name }}
        GIT_COMMITTER_EMAIL: ${{ inputs.author-email }}
      run: |
        import { ensurePullRequest, hasTrackedChanges, input, remoteBranchExists, run, setOutput } from 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/actions/lib.ts';

        const branch = input('branch', { required: true });
        const title = input('title', { required: true });
        const message = input('message') || title;
        const body = input('body');
        const base = input('base', { required: true });
        const token = Deno.env.get('GH_TOKEN') ?? '';

        if (!(await hasTrackedChanges())) {
          await setOutput('result', 'unchanged');
          await setOutput('url', '');
        } else {
          if (!(await remoteBranchExists(branch))) {
            await run('git', ['switch', '-c', branch]);
            await run('git', ['commit', '-a', '-m', message]);
            await run('git', ['push', '-u', 'origin', branch], {
              GIT_CONFIG_COUNT: '2',
              GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0: '',
              GIT_CONFIG_KEY_1: 'http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_1: `AUTHORIZATION: basic ${btoa(`x-access-token:${token}`)}`,
            });
          }
          const pr = await ensurePullRequest(branch, base, title, body);

          await setOutput('result', pr.created ? 'created' : 'exists');
          await setOutput('url', pr.url);
        }
